[package]
name = "selah"
version = "0.1.0"
edition = "2024"
description = "Linux control panel for Audient iD audio interfaces"
publish = false

[dependencies]
futures-core = "0.3"
iced = { version = "0.14", features = ["canvas", "tokio"] }
nusb = { version = "0.2", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
